<!DOCTYPE html>
<html lang="en" data-faction="republic">
<head>
<meta charset="utf-8">
<title>Holonet RP Console</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#04080f;--panel:#0a1422;--panel2:#0e1c30;--line:#1d4f7a;--acc:#4cc3ff;--acc2:#a8e4ff;--txt:#cfe3f3;--dim:#6f8ba3;--glow:rgba(76,195,255,.35);--warn:#ffcf5a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-faction="empire"]{--line:#7a1d1d;--acc:#ff5a4a;--acc2:#ffc2b8;--glow:rgba(255,90,74,.35);--panel:#150a0c;--panel2:#220e12;--bg:#0a0405}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:radial-gradient(ellipse at top,var(--panel2),var(--bg) 60%) fixed;color:var(--txt);font-family:Rajdhani,"Segoe UI",Arial,sans-serif;font-size:17px;min-height:100vh}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:14px 20px;border-bottom:2px solid var(--line);background:linear-gradient(var(--panel2),var(--panel));box-shadow:0 0 20px var(--glow)}
h1{font:700 20px Orbitron,Rajdhani,sans-serif;letter-spacing:.18em;margin:0;color:var(--acc2);text-transform:uppercase}
h1 small{display:block;font:500 12px Rajdhani,sans-serif;letter-spacing:.3em;color:var(--dim)}
.fac button{margin-left:6px}
main{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:18px;padding:18px 20px;max-width:1300px;margin:auto}
@media(max-width:860px){main{grid-template-columns:1fr}}
.panel{background:linear-gradient(var(--panel2),var(--panel));border:1px solid var(--line);padding:0 16px 16px;position:relative;clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,16px 100%,0 calc(100% - 16px));box-shadow:inset 0 0 30px rgba(0,0,0,.5)}
.panel h2{margin:0 -16px 14px;padding:9px 16px;font:700 14px Orbitron,Rajdhani,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--acc);background:linear-gradient(90deg,rgba(76,195,255,.12),transparent);border-bottom:1px solid var(--line)}
.full{grid-column:1/-1}
textarea,input,select{width:100%;background:#02060c;border:1px solid var(--line);color:var(--txt);font:500 17px Rajdhani,sans-serif;padding:9px 11px;outline:none}
textarea{min-height:170px;resize:vertical}
textarea:focus,input:focus,select:focus{border-color:var(--acc);box-shadow:0 0 10px var(--glow)}
button{font:700 14px Orbitron,Rajdhani,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--acc2);background:linear-gradient(var(--panel2),var(--panel));border:1px solid var(--acc);padding:8px 14px;cursor:pointer;clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,8px 100%,0 calc(100% - 8px))}
button:hover{background:var(--acc);color:#02060c;box-shadow:0 0 14px var(--glow)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0}
label{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);display:block;margin-bottom:3px}
.meta{display:flex;justify-content:space-between;color:var(--dim);font-size:14px;margin-top:4px}
.seg{border:1px solid var(--line);background:#02060c;margin-top:10px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px}
.seg.done{opacity:.55;border-color:var(--acc)}
.seg p{margin:0;word-break:break-word;white-space:pre-wrap}
.seg .n{color:var(--dim);font-size:13px;letter-spacing:.1em;margin-top:4px}
.seg .n.bad{color:var(--warn)}
.die{display:flex;flex-direction:column;align-items:center;gap:12px;padding-top:6px}
.d20{width:140px;height:140px;display:grid;place-items:center;font:700 48px Orbitron,sans-serif;color:var(--acc2);background:radial-gradient(circle,var(--panel2),#02060c);border:2px solid var(--acc);clip-path:polygon(50% 0,95% 25%,95% 75%,50% 100%,5% 75%,5% 25%);text-shadow:0 0 14px var(--acc)}
.d20.crit{color:#7dff9b;text-shadow:0 0 18px #7dff9b}.d20.fail{color:#ff6b6b;text-shadow:0 0 18px #ff6b6b}
.row{display:flex;gap:10px;align-items:end;width:100%}
.hist{width:100%;color:var(--dim);font-size:15px;max-height:150px;overflow:auto;border-top:1px solid var(--line);padding-top:8px}
.emotes{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px;margin-top:12px;padding-right:0}
.emotes button{font:600 15px Rajdhani,sans-serif;letter-spacing:.04em;text-transform:none;padding:6px 8px;text-align:left}
.leg{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0;align-items:center}.leg span{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}.leg button{font:600 14px Rajdhani,sans-serif;text-transform:none;padding:5px 12px}.leg button.off{opacity:.35;text-decoration:line-through}
.tF{background:#183010!important;border-color:#4a9a30!important}.tS{background:#301010!important;border-color:#a03030!important}.tC{background:#302810!important;border-color:#a08030!important}.tU{background:#000!important;border-color:#8aa0b0!important}
.emotes button:hover{filter:brightness(1.8)}
.d20.spin{animation:spin .7s ease-out}@keyframes spin{0%{transform:rotate(0) scale(.85)}70%{transform:rotate(540deg) scale(1.08)}100%{transform:rotate(720deg) scale(1)}}
.tip{position:fixed;z-index:50;max-width:260px;pointer-events:none;opacity:0;transition:opacity .12s;background:linear-gradient(#0c1a2c,#050b14);border:1px solid var(--acc);box-shadow:0 0 16px var(--glow),inset 0 0 14px rgba(0,0,0,.6);padding:8px 12px;clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,8px 100%,0 calc(100% - 8px))}.tip.on{opacity:1}
.tip b{display:block;font:700 15px Orbitron,Rajdhani,sans-serif;letter-spacing:.08em;color:var(--acc2)}.tip i{display:block;font:600 12px Rajdhani,sans-serif;letter-spacing:.16em;text-transform:uppercase;margin:2px 0 6px}.tip p{margin:0;font-size:16px;line-height:1.25}.tip em{display:block;margin-top:6px;font-size:12px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase;font-style:normal}
.tip[data-k=F]i{color:#6fd84a}.tip[data-k=S]i{color:#ff6b6b}.tip[data-k=C]i{color:#e8b64a}.tip[data-k=U]i{color:#b8d0e0}
:root[data-faction="republic"]{--bg:#030914;--panel:#091730;--panel2:#12274d;--line:#3b6fb8;--acc:#f0c85a;--acc2:#fff3c9;--txt:#d6e4f5;--dim:#7f98b8;--glow:rgba(240,200,90,.28)}
.ctl{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:flex-end;margin-left:auto}.brand{display:flex;gap:12px;align-items:center}
.crest{width:54px;height:54px;color:var(--acc);flex:none;filter:drop-shadow(0 0 6px var(--glow))}.crest.emp{display:none}[data-faction="empire"] .crest.rep{display:none}[data-faction="empire"] .crest.emp{display:block}
[data-faction="republic"] [data-f="republic"],[data-faction="empire"] [data-f="empire"]{background:var(--acc);color:var(--bg)}
:root[data-bg="mando"]{--bg:#0b0c0a;--panel:#191b17;--panel2:#262b21;--line:#5f7a48;--acc:#e0a030;--acc2:#f3dca4;--txt:#dedfd2;--dim:#8d927d;--glow:rgba(224,160,48,.3)}
:root[data-bg="mando"] body{background:repeating-linear-gradient(135deg,rgba(255,255,255,.025) 0 2px,transparent 2px 16px),radial-gradient(ellipse at top,#2f3627,var(--bg) 65%) fixed}
:root[data-bg="light"]{--bg:#eef1f4;--panel:#ffffff;--panel2:#e3e9ef;--line:#7a94ad;--acc:#1f6fa8;--acc2:#0d3f66;--txt:#16232f;--dim:#586d7f;--glow:rgba(31,111,168,.22)}
:root[data-bg="light"] textarea,:root[data-bg="light"] input,:root[data-bg="light"] select,:root[data-bg="light"] .seg{background:#fff}
:root[data-bg="light"] .d20{background:radial-gradient(circle,#fff,#dce6ef);text-shadow:none}
:root[data-bg="light"] button:hover{color:#fff}
:root[data-bg="light"] .toast{color:#fff}
:root[data-bg="light"] .emotes button,:root[data-bg="light"] .leg button{color:#e8f4ff}
:root[data-bg="light"] .tip{background:linear-gradient(#fff,#e9eff5)}
:root[data-bg="black"]{--bg:#000;--panel:#0a0a0a;--panel2:#141414;--line:#3c3c3c;--acc:#d6d6d6;--acc2:#fff;--txt:#e6e6e6;--dim:#858585;--glow:rgba(255,255,255,.16)}
:root[data-bg="black"] body{background:#000}
:root[data-bg="black"] textarea,:root[data-bg="black"] input,:root[data-bg="black"] select,:root[data-bg="black"] .seg,:root[data-bg="black"] .d20{background:#000}
:root[data-bg="black"] .tip{background:#050505}
.bgsel{display:flex;gap:6px;align-items:center}.bgsel span{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}.bgsel button.on{background:var(--acc);color:var(--bg)}
.tabs{display:flex;gap:6px;margin-bottom:14px}.tabs button.on{background:var(--acc);color:var(--bg)}
.ro{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel2);padding:6px 10px;margin-top:6px}.ro span:first-child{flex:1;word-break:break-word}.ro .r{font:700 14px Orbitron,sans-serif;color:var(--acc);white-space:nowrap}.ro .x{padding:2px 8px;font-size:12px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--acc);color:#02060c;font:700 14px Orbitron,sans-serif;padding:8px 18px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
</style>
</head>

<script>
const $=id=>document.getElementById(id);
const root=document.documentElement;
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1100)}
async function copy(t){try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(x){}a.remove()}toast('Copied')}
function setBg(v){if(!['republic','empire','mando','light','black'].includes(v))v='republic';if(v==='republic'||v==='empire'){root.dataset.faction=v;delete root.dataset.bg}else{root.dataset.bg=v}document.querySelectorAll('[data-b]').forEach(b=>b.classList.toggle('on',b.dataset.b===v));try{localStorage.setItem('hrc-b',v)}catch(e){}}
document.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>setBg(b.dataset.b));
try{setBg(localStorage.getItem('hrc-b')||'republic')}catch(e){setBg('republic')}

/* Segmenter */
let segs=[],done=new Set();
function split(){
const txt=$('src').value.replace(/\s+/g,' ').trim();
const pre=$('pre').value,more=$('more').value,last=$('last').value;
const lim=Math.min(255,Math.max(50,parseInt($('lim').value)||255));
$('total').textContent=txt.length+' characters';
segs=[];done=new Set();
if(!txt){render();return}
const words=txt.split(' ');
let cur='';
const room=(m)=>lim-pre.length-(m?m.length+1:0);
function push(body,m){segs.push(pre+body+(m?' '+m:''))}
let i=0;
const remaining=()=>words.slice(i).join(' ');
while(i<words.length){
 if(remaining().length<=room(last)){push(remaining(),last&&segs.length?last:'');break}
 const r=room(more);cur='';
 while(i<words.length){
  let w=words[i];
  if(w.length>r){ if(cur)break; cur=w.slice(0,r);words[i]=w.slice(r);break}
  const t=cur?cur+' '+w:w;
  if(t.length>r)break;
  cur=t;i++;
 }
 push(cur,more);
}
render();
}
function render(){
$('count').textContent=segs.length+' segment'+(segs.length===1?'':'s');
const o=$('out');o.innerHTML='';
segs.forEach((s,k)=>{
 const d=document.createElement('div');d.className='seg'+(done.has(k)?' done':'');
 const p=document.createElement('div');
 const t=document.createElement('p');t.textContent=s;
 const n=document.createElement('div');n.className='n'+(s.length>255?' bad':'');n.textContent='Part '+(k+1)+' of '+segs.length+' · '+s.length+'/255';
 p.append(t,n);
 const b=document.createElement('button');b.textContent='Copy';
 b.onclick=()=>{copy(s);done.add(k);d.classList.add('done')};
 d.append(p,b);o.appendChild(d);
});
}
$('clearall').onclick=()=>{$('src').value='';split();$('src').focus()};
$('copyall').onclick=()=>{const k=segs.findIndex((_,x)=>!done.has(x));if(k<0){toast(segs.length?'All copied':'Nothing yet');return}copy(segs[k]);done.add(k);render()};
['src','pre','more','last','lim'].forEach(id=>$(id).addEventListener('input',split));

/* Dice */
let lastRoll='';
let busy=false;
$('roll').onclick=()=>{
 if(busy)return;busy=true;
 const m=parseInt($('mod').value)||0,n=parseInt($('die').value)||20,r=Math.floor(Math.random()*n)+1,tot=r+m,d=$('d20');
 d.className='d20 spin';
 const iv=setInterval(()=>{d.textContent=Math.floor(Math.random()*n)+1},70);
 setTimeout(()=>{
  clearInterval(iv);busy=false;
  d.textContent=r;d.style.fontSize=r>99?'34px':'';d.className='d20'+(n===20&&r===20?' crit':n===20&&r===1?' fail':'');
  lastRoll='[D'+n+': '+r+(m?(m>0?' + ':' − ')+Math.abs(m)+' = '+tot:'')+']'+(n===20&&r===20?' Critical!':n===20&&r===1?' Critical fail!':'');
  const h=$('hist');if(h.textContent==='No rolls yet.')h.textContent='';
  const l=document.createElement('div');l.textContent=lastRoll;h.prepend(l);
 },700);
};
$('clr').onclick=()=>{if(busy)return;$('hist').textContent='No rolls yet.';lastRoll='';$('d20').textContent=$('die').value;$('d20').style.fontSize='';$('d20').className='d20'};
$('die').onchange=()=>{if(busy)return;$('d20').textContent=$('die').value;$('d20').style.fontSize='';$('d20').className='d20'};
$('copyroll').onclick=()=>lastRoll?copy(lastRoll):toast('Roll first');

'Give a thumbs up.',tickle:'Tickle someone.',tired:'Sigh (with voice line).',trooper:'Salute with an energy shield?',victory:'Pump your fist.',wait:'Tell someone to wait.',warmup:'Limber up.',wave:'Wave to someone.',welcome:'Welcome with arms wide.',weld:'Make repairs.',whine:'Whine to someone.',whistle:'Whistle.',wicked:'Wolfish smile.',wink:'Wink coyly.',woot:'Same as /cheer.',yawn:'Yawn and stretch.',yes:'Agree with someone (with voice line).',alarmed:'Slightly frightful.',angered:'Angry.',annoyed:'Unpleasantly upset.',astounded:'Dumbfounded.',awed:'Awestruck.',cheery:'In a good mood.',cobalt:'Cobalt Durasteel!',creepy:'Leering unpleasantly.',crying:'Weeping.',dejected:'Bummed out.',depressed:'Sad and lethargic.',discomforted:'Displeased.',disdained:'Disgusted.',eager:'A little too happy.',ecstatic:'Very pleased.',enraged:'Glaring in anger.',fearful:'Scared.',flattered:'Cocky and confident.',frustrated:'Angry and impatient.',furious:'Unhinged with anger.',goofy:'Clowning around.',hurt:'Wincing.',jawaface:'Making a funny face.',joyful:'Happy.',meditative:'Serene contemplation.',mournful:'Sad and mopey.',neutral:'Default mood.',outraged:'Shocked and upset.',pained:'Wincing.',pout:'Petulant.',saddened:'Sad.',scowling:'Unhappy.',sly:'Shifty.',snide:'Unimpressed.',stunned:'Shocked.',terrified:'Very scared.'};
const tip=$('tip');
function showT(e,ev){tip.dataset.k=e[1];tip.innerHTML='';const b=document.createElement('b'),i=document.createElement('i'),p=document.createElement('p'),m=document.createElement('em');b.textContent='/'+e[0];i.textContent=L[e[1]];p.textContent=D[e[0]]||'No description available.';m.textContent='Click to copy';tip.append(b,i,p,m);tip.classList.add('on');mv(ev)}
function mv(ev){const r=tip.getBoundingClientRect();let x=ev.clientX+16,y=ev.clientY+16;if(x+r.width>innerWidth-8)x=ev.clientX-r.width-12;if(y+r.height>innerHeight-8)y=ev.clientY-r.height-12;tip.style.left=Math.max(4,x)+'px';tip.style.top=Math.max(4,y)+'px'}
function drawE(){const q=$('q').value.toLowerCase().trim(),g=$('emotes');g.innerHTML='';
 E.filter(e=>on[e[1]]&&e[0].includes(q)).forEach(e=>{const b=document.createElement('button');b.textContent='/'+e[0];b.className='t'+e[1];b.onclick=()=>copy('/'+e[0]);b.onmouseenter=ev=>showT(e,ev);b.onmousemove=mv;b.onmouseleave=()=>tip.classList.remove('on');g.appendChild(b)})}

let roster=[],rolling=false;

 if(!roster.length){o.textContent='Add names, then roll.';o.style.color='var(--dim)';o.style.marginTop='12px';return}
 o.style.color='';o.style.marginTop='';
 roster.forEach((c,i)=>{const d=document.createElement('div');d.className='ro';
  const a=document.createElement('span');a.textContent=(c.t!=null?(i+1)+'. ':'')+c.n;
  const b=document.createElement('span');b.className='r';b.textContent=c.t==null?(c.m?(c.m>0?'+':'−')+Math.abs(c.m):''):c.r+(c.m?(c.m>0?' + ':' − ')+Math.abs(c.m):'')+' = '+c.t;
  const x=document.createElement('button');x.className='x';x.textContent='✕';x.onclick=()=>{if(rolling)return;roster.splice(i,1);rr()};
